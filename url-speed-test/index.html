<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>网页 URL 测速工具</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, Helvetica, "Microsoft YaHei", sans-serif; background: #111; color: #eee; min-height: 100vh; }
    .container { max-width: 960px; margin: 0 auto; padding: 40px 20px 80px; }
    h1 { font-size: 24px; margin-bottom: 8px; }
    .sub { color: #999; font-size: 13px; margin-bottom: 26px; }
    .input-row { display: flex; gap: 10px; }
    #urlInput {
      flex: 1; padding: 12px 14px; font-size: 15px; color: #eee;
      background: #181818; border: 1px solid #333; border-radius: 8px; outline: none;
    }
    #urlInput:focus { border-color: #2196f3; }
    button {
      padding: 12px 24px; font-size: 15px; font-weight: 600; border: none; border-radius: 8px;
      cursor: pointer; background: #2196f3; color: #fff; transition: background .2s;
    }
    button:hover:not(:disabled) { background: #1976d2; }
    button:disabled { background: #375a75; cursor: not-allowed; }
    #status { margin-top: 16px; font-size: 13px; color: #999; min-height: 18px; word-break: break-all; }
    .progress-wrap { margin-top: 10px; height: 8px; background: #222; border-radius: 4px; overflow: hidden; display: none; }
    .progress-wrap.show { display: block; }
    #progressBar { height: 100%; width: 0; background: linear-gradient(90deg, #2196f3, #64b5f6); transition: width .3s; }
    #errorBox { display: none; margin-top: 16px; padding: 12px 14px; background: #3d1414; color: #ff8a8a; border: 1px solid #5c1f1f; border-radius: 8px; font-size: 13px; word-break: break-all; }
    .card { background: #181818; border-radius: 10px; margin-top: 24px; overflow: hidden; display: none; }
    .card.show { display: block; }
    .card-head { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; border-bottom: 1px solid #2a2a2a; font-weight: 600; }
    .card-head .total { color: #999; font-size: 12px; font-weight: 400; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 11px 18px; text-align: left; font-size: 13px; }
    thead th { background: #1f1f1f; color: #999; font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .5px; }
    tbody tr { border-top: 1px solid #262626; cursor: pointer; }
    tbody tr:hover { background: #202020; }
    .rank { width: 56px; font-weight: 700; color: #2196f3; }
    .url-cell { max-width: 420px; }
    .url-cell a { color: #64b5f6; text-decoration: underline; word-break: break-all; }
    .url-cell a:hover { color: #90caf9; }
    .speed { font-weight: 700; color: #4caf50; min-width: 84px; }
    .speed.fail { color: #ef5350; }
    .speed.pending { color: #ffb300; }
    .samples { color: #6b7280; font-size: 11px; }
    .tag { display: inline-block; font-size: 10px; padding: 2px 7px; border-radius: 9px; margin-left: 8px; vertical-align: 2px; }
    .tag.html { background: #0d2538; color: #4fc3f7; }
    .tag.css { background: #3a3006; color: #ffd54f; }
    .tag.js { background: #3a0f24; color: #f06292; }
    .tag.img { background: #12321c; color: #66bb6a; }
    .tag.other { background: #262626; color: #9e9e9e; }
  </style>
</head>
<body>
  <div class="container">
    <h1>网页 URL 测速工具</h1>
    <p class="sub">输入网址，自动提取页面上的所有 http/https 地址（自动去重），每个地址测速 5 次取平均值，按速度从快到慢排序，点击可跳转。</p>

    <div class="input-row">
      <input id="urlInput" type="text" placeholder="https://example.com" spellcheck="false" />
      <button id="startBtn">开始测速</button>
    </div>
    <div id="errorBox"></div>
    <div id="status"></div>
    <div class="progress-wrap" id="progressWrap">
      <div id="progressBar"></div>
    </div>

    <div class="card" id="resultCard">
      <div class="card-head">
        <span>测速结果</span>
        <span class="total" id="resultTotal"></span>
      </div>
      <table>
        <thead>
          <tr><th>排名</th><th>地址</th><th>平均耗时</th><th>5 次样本 (ms)</th></tr>
        </thead>
        <tbody id="resultBody"></tbody>
      </table>
    </div>
  </div>

  <script>
    (function () {
      const input = document.getElementById('urlInput');
      const btn = document.getElementById('startBtn');
      const statusEl = document.getElementById('status');
      const errorBox = document.getElementById('errorBox');
      const progressWrap = document.getElementById('progressWrap');
      const progressBar = document.getElementById('progressBar');
      const resultCard = document.getElementById('resultCard');
      const resultBody = document.getElementById('resultBody');
      const resultTotal = document.getElementById('resultTotal');

      const TEST_TIMES = 5;
      const SAMPLE_TIMEOUT = 15000;
      const URL_TIMEOUT = 120000;
      const CONCURRENCY = 4;
      const PROXIES = [
        (u) => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u),
        (u) => 'https://corsproxy.io/?url=' + encodeURIComponent(u)
      ];

      function setStatus(t) { statusEl.textContent = t; }
      function setError(t) {
        if (t) { errorBox.textContent = t; errorBox.style.display = 'block'; }
        else errorBox.style.display = 'none';
      }

      async function fetchText(url) {
        for (const proxy of PROXIES) {
          try {
            const resp = await fetch(proxy(url), { redirect: 'follow' });
            if (!resp.ok) continue;
            return await resp.text();
          } catch (e) { /* 尝试下一个代理 */ }
        }
        throw new Error('所有代理抓取失败，请稍后再试或更换网址');
      }

      function collectScriptLinks(html, pageUrl, timeout) {
        return new Promise((resolve) => {
          const scriptRe = /<script(?![^>]*\bsrc=)[^>]*>([\s\S]*?)<\/script>/gi;
          const blocks = [];
          let m;
          while ((m = scriptRe.exec(html))) if (m[1].trim()) blocks.push(m[1]);
          const onload = (html.match(/<body[^>]*\bonload\s*=\s*["']([^"']+)["']/i) || [])[1] || '';
          if (blocks.length === 0) return resolve([]);
          const u = new URL(pageUrl);
          const workerCode = `
            var __links = [];
            function __makeEl() {
              var el = {
                href:'', src:'', innerHTML:'', innerText:'', textContent:'', title:'', id:'',
                style:{}, className:'', disabled:false,
                appendChild:function(){}, removeChild:function(){}, setAttribute:function(){},
                getAttribute:function(){return null;}, addEventListener:function(){},
                removeEventListener:function(){}, querySelector:function(){return null;},
                querySelectorAll:function(){return [];}, focus:function(){}, click:function(){},
                classList:{add:function(){},remove:function(){},toggle:function(){}}
              };
              var _h = '';
              Object.defineProperty(el, 'href', {
                get: function(){ return _h; },
                set: function(v){
                  _h = v;
                  var s = String(v);
                  if (s.indexOf('#') === 0 || s.indexOf('javascript:') === 0) return;
                  if (s.indexOf('undefined') >= 0 || s.indexOf('NaN') >= 0) return;
                  __links.push(s);
                }
              });
              return el;
            }
            function __sandbox(document, location, navigator, window, top, parent, frames, self, screen, history, fetch, XMLHttpRequest, WebSocket, EventSource, importScripts, alert, confirm, prompt) {
              ${blocks.map((s) => 'try {\n' + s + '\n} catch(e) {}').join('\n')}
              ${onload ? 'try { eval(' + JSON.stringify(onload) + '); } catch(e) {}' : ''}
            }
            var __doc = {
              lastModified: ${JSON.stringify(new Date(Date.now() - 86400000).toString())},
              title:'', cookie:'', readyState:'complete',
              body:{ onload:null, style:{}, appendChild:function(){}, innerHTML:'' },
              documentElement:{ style:{} },
              getElementById: function(id){ if(!__els[id]) __els[id] = __makeEl(); return __els[id]; },
              getElementsByName: function(){ return []; },
              getElementsByTagName: function(){ return []; },
              getElementsByClassName: function(){ return []; },
              querySelector: function(){ return null; },
              querySelectorAll: function(){ return []; },
              createElement: __makeEl,
              createTextNode: function(){ return {}; },
              write: function(){}, writeln: function(){},
              addEventListener: function(){}
            };
            var __els = {};
            var __loc = { href: ${JSON.stringify(pageUrl)}, protocol: '${u.protocol}', host: '${u.host}', hostname: '${u.hostname}', pathname: '${u.pathname}', search: '${u.search}', hash: '' };
            var __nav = { userAgent: 'Mozilla/5.0', sendBeacon: function(){} };
            var __w = { document: __doc, location: __loc, innerWidth: 1920, innerHeight: 1080, screen: {}, addEventListener: function(){}, setTimeout: setTimeout, setInterval: setInterval, clearTimeout: clearTimeout, clearInterval: clearInterval };
            var __noopWin = { document: __doc, location: __loc, screen: {}, addEventListener: function(){}, setTimeout: setTimeout, setInterval: setInterval, clearTimeout: clearTimeout, clearInterval: clearInterval };
            __sandbox(
              __doc, __loc, __nav, __w, __noopWin, __noopWin, __noopWin, self, {},
              { pushState:function(){}, replaceState:function(){}, href:'' },
              function(){ return Promise.reject(new Error('blocked')); },
              function(){ throw new Error('blocked'); },
              function(){ throw new Error('blocked'); },
              function(){ throw new Error('blocked'); },
              function(){},
              function(){}, function(){ return false; }, function(){ return null; }
            );
            try {
              var out = [];
              for (var id in __els) if (__els[id].href) out.push(__els[id].href);
              postMessage({ links: out });
            } catch(e) { postMessage({ links: [] }); }
          `;
          const blob = new Blob([workerCode], { type: 'text/javascript' });
          const worker = new Worker(URL.createObjectURL(blob));
          const timer = setTimeout(() => { worker.terminate(); resolve([]); }, timeout);
          worker.onmessage = (e) => { clearTimeout(timer); worker.terminate(); resolve(e.data && e.data.links ? e.data.links : []); };
          worker.onerror = () => { clearTimeout(timer); worker.terminate(); resolve([]); };
        });
      }

      function extractUrls(html, base) {
        const urls = new Set();
        const add = (raw) => {
          try {
            const u = new URL(raw, base);
            if (u.protocol !== 'http:' && u.protocol !== 'https:') return;
            urls.add(u.href);
          } catch (e) { }
        };
        const tagRe = /<(a|img|script|link|iframe|video|audio|source|embed)\b[^>]*>/gi;
        const attrRe = /(?:href|src)\s*=\s*("([^"]*)"|'([^']*)'|([^\s"'=<>`]+))/gi;
        let m;
        while ((m = tagRe.exec(html))) {
          const tag = m[1].toLowerCase();
          let a;
          attrRe.lastIndex = 0;
          while ((a = attrRe.exec(m[0]))) {
            const v = a[2] || a[3] || a[4];
            if (!v || v.startsWith('#') || v.startsWith('data:')) continue;
            if (tag === 'link' && !/stylesheet|icon|manifest|preload|preconnect|dns-prefetch/i.test(m[0])) continue;
            add(v);
          }
        }
        const cssRe = /url\(\s*(['"]?)([^'")]+)\1\s*\)/gi;
        while ((m = cssRe.exec(html))) {
          if (!m[2].startsWith('data:')) add(m[2]);
        }
        return [...urls];
      }

      function timingUrl(u) {
        try {
          const p = new URL(u);
          if (location.protocol === 'https:' && p.protocol === 'http:') p.protocol = 'https:';
          return p.href;
        } catch (e) { return u; }
      }

      async function measureOnce(target) {
        const url = timingUrl(target);
        const start = performance.now();
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), SAMPLE_TIMEOUT);
        try {
          await fetch(url, { mode: 'no-cors', cache: 'no-store', signal: controller.signal });
          return Math.round(performance.now() - start);
        } catch (e) {
          if (e.name === 'AbortError') return null;
          return Math.round(performance.now() - start);
        } finally {
          clearTimeout(timer);
        }
      }

      async function testUrl(target, onSample) {
        const samples = [];
        const overallStart = Date.now();
        for (let i = 0; i < TEST_TIMES; i++) {
          if (Date.now() - overallStart >= URL_TIMEOUT) {
            return { url: target, average: null, samples, success: samples.length, timeout: true };
          }
          const ms = await measureOnce(target);
          if (ms !== null) samples.push(ms);
          if (onSample) onSample(i + 1);
        }
        if (samples.length === 0) return { url: target, average: null, samples: [], success: 0 };
        const sum = samples.reduce((a, b) => a + b, 0);
        return { url: target, average: Math.round(sum / samples.length), samples, success: samples.length };
      }

      function typeOf(url) {
        try {
          const p = new URL(url);
          const path = p.pathname.toLowerCase();
          if (/\.(css)(\?|$)/.test(path) || /styles?\./i.test(path)) return 'css';
          if (/\.(js|mjs)(\?|$)/.test(path)) return 'js';
          if (/\.(png|jpe?g|gif|webp|svg|avif|ico)(\?|$)/.test(path)) return 'img';
          if (path === '/' || /\.(html?)(\?|$)/.test(path)) return 'html';
        } catch (e) { }
        return 'other';
      }
      const TAG_TEXT = { html: 'HTML', css: 'CSS', js: 'JS', img: '图片', other: '其他' };
      const TAG_CLASS = { html: 'html', css: 'css', js: 'js', img: 'img', other: 'other' };

      function sameSite(url, base) {
        try {
          const a = new URL(url).hostname.replace(/^www\./, '');
          const b = new URL(base).hostname.replace(/^www\./, '');
          return a === b;
        } catch (e) { return false; }
      }

      btn.addEventListener('click', run);
      input.addEventListener('keydown', (e) => { if (e.key === 'Enter') run(); });

      async function run() {
        const target = input.value.trim();
        setError('');
        if (!target) { setError('请输入网址'); return; }
        let normalized;
        try { normalized = new URL(/^https?:\/\//i.test(target) ? target : 'https://' + target).href; }
        catch (e) { setError('网址格式不正确'); return; }

        btn.disabled = true;
        resultCard.classList.remove('show');
        resultBody.innerHTML = '';
        progressBar.style.width = '0';
        progressWrap.classList.add('show');
        setStatus('正在抓取页面并提取 URL...');

        let urls;
        try {
          const html = await fetchText(normalized);
          urls = extractUrls(html, normalized);
          setStatus('正在提取 JS 动态生成的地址...');
          const dynamic = await collectScriptLinks(html, normalized, 8000);
          dynamic.forEach((raw) => {
            try {
              const u = new URL(raw, normalized);
              if (u.protocol === 'http:' || u.protocol === 'https:') urls.push(u.href);
            } catch (e) { }
          });
          urls = [...new Set(urls)];
        } catch (err) {
          setError('抓取页面失败：' + err.message);
          progressWrap.classList.remove('show');
          btn.disabled = false;
          return;
        }

        if (urls.length === 0) {
          setError('未在页面中找到任何 http/https 地址');
          progressWrap.classList.remove('show');
          btn.disabled = false;
          return;
        }

        const skipped = urls.filter((u) => sameSite(u, normalized)).length;
        urls = urls.filter((u) => !sameSite(u, normalized));
        if (urls.length === 0) {
          setError('页面中的地址全部属于本站（' + normalized + '），已忽略，无需测速');
          progressWrap.classList.remove('show');
          btn.disabled = false;
          return;
        }

        setStatus('共提取到 ' + urls.length + ' 个 URL（已去重' + (skipped ? '，忽略本站 ' + skipped + ' 个' : '') + '），开始测速...');

        renderInitial(urls);

        let done = 0;
        let next = 0;
        async function runner() {
          while (next < urls.length) {
            const i = next++;
            const target = urls[i];
            const result = await testUrl(target, (k) => {
              const row = rowMap.get(target);
              if (row && !row.done) row.samplesTd.textContent = '测试中 ' + k + '/' + TEST_TIMES;
            });
            done++;
            applyResult(target, result);
            const pct = Math.round(done / urls.length * 100);
            progressBar.style.width = pct + '%';
            setStatus('测速进度：' + done + ' / ' + urls.length + '（' + pct + '%），已完成的可直接点击打开');
          }
        }
        const runners = [];
        for (let k = 0; k < Math.min(CONCURRENCY, urls.length); k++) runners.push(runner());
        await Promise.all(runners);

        progressWrap.classList.remove('show');
        btn.disabled = false;
        setStatus('测速完成，已按平均耗时从快到慢排序，点击地址可跳转。');
      }

      const rowMap = new Map();

      function renderInitial(urls) {
        resultBody.innerHTML = '';
        resultCard.classList.add('show');
        resultTotal.textContent = '共 ' + urls.length + ' 个地址，测试中...';

        urls.forEach((url, idx) => {
          const tr = document.createElement('tr');
          tr.title = '点击打开：' + url;
          tr.addEventListener('click', () => window.open(url, '_blank', 'noopener'));
          const type = typeOf(url);

          const rankTd = document.createElement('td');
          rankTd.className = 'rank';
          rankTd.textContent = idx + 1;

          const urlTd = document.createElement('td');
          urlTd.className = 'url-cell';
          const link = document.createElement('a');
          link.href = url;
          link.target = '_blank';
          link.rel = 'noopener';
          link.textContent = url;
          urlTd.appendChild(link);
          const tag = document.createElement('span');
          tag.className = 'tag ' + TAG_CLASS[type];
          tag.textContent = TAG_TEXT[type];
          urlTd.appendChild(tag);

          const speedTd = document.createElement('td');
          speedTd.className = 'speed pending';
          speedTd.textContent = '测试中...';

          const samplesTd = document.createElement('td');
          samplesTd.className = 'samples';

          tr.appendChild(rankTd);
          tr.appendChild(urlTd);
          tr.appendChild(speedTd);
          tr.appendChild(samplesTd);
          resultBody.appendChild(tr);

          rowMap.set(url, { tr, rankTd, speedTd, samplesTd, avg: null, done: false });
        });
      }

      function applyResult(url, result) {
        const row = rowMap.get(url);
        if (!row) return;
        row.done = true;
        if (result.average === null) {
          row.avg = null;
          row.speedTd.className = 'speed fail';
          row.speedTd.textContent = result.timeout ? '超时' : '失败';
          row.samplesTd.textContent = result.timeout ? '超过 ' + Math.round(URL_TIMEOUT / 1000) + 's 未完成' : '—';
        } else {
          row.avg = result.average;
          row.speedTd.className = 'speed';
          row.speedTd.textContent = result.average + ' ms';
          row.samplesTd.textContent = result.samples.join(' / ');
        }
        const ok = [...rowMap.values()].filter((r) => r.done && r.avg !== null).length;
        const fail = [...rowMap.values()].filter((r) => r.done && r.avg === null).length;
        resultTotal.textContent = '共 ' + rowMap.size + ' 个地址（已完成 ' + ok + ' 个成功，' + fail + ' 个失败）';
        resortRows();
      }

      function resortRows() {
        const all = [...rowMap.values()];
        const sorted = all
          .filter((r) => r.done && r.avg !== null)
          .sort((a, b) => a.avg - b.avg);
        const rest = all.filter((r) => !(r.done && r.avg !== null));
        sorted.concat(rest).forEach((row, i) => {
          row.rankTd.textContent = i + 1;
          resultBody.appendChild(row.tr);
        });
      }
    })();
  </script>
</body>
</html>
