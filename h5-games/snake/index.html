<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>贪吃蛇 · 小蛇吃果</title>
  <link rel="stylesheet" href="../shared/base.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="game"></canvas>

    <!-- 游戏内 HUD（DOM 覆盖层，由 game.js 更新） -->
    <div id="hud" class="hidden">
      <div class="hud-top">
        <div class="hud-pill">第 <b id="levelText">1</b> 关</div>
        <div class="hud-pill">分数 <b id="scoreText">0</b></div>
        <div class="hud-pill">最高 <b id="bestText">0</b></div>
        <div class="hud-pill">长度 <b id="lenText">3</b></div>
        <div class="hud-pill">生命 <b id="livesText">♥♥♥</b></div>
      </div>
      <div id="toast" class="hidden"></div>
    </div>
  </div>

  <!-- 开始界面 -->
  <div id="startScreen" class="overlay">
    <div class="card">
      <div class="title-tag">SNAKE</div>
      <h1>贪吃蛇</h1>
      <p class="subtitle">吃苹果长大 · 别咬到自己</p>
      <div class="howto">
        <p>用<b>方向键 / WASD</b> 给小蛇转弯，它自己会一直往前爬。</p>
        <p>吃到<b>红苹果</b>加 10 分、身体变长；偶尔冒出的<b>金星</b>加 50 分，要快点去吃。</p>
        <p>撞到墙<b>不会死</b>——小蛇会从另一边钻出来。</p>
        <p>不小心咬到自己会<b>掉一颗心</b>，掉光就结束。一共有 3 颗心。</p>
        <p>每吃 6 个苹果升一关，蛇会爬得更快一点。</p>
      </div>
      <p class="best-line">历史最高：<b id="startBest">0</b></p>
      <button id="btnStart" class="big-btn tv-focus" data-tv-focus autofocus>开始游戏</button>
      <p class="hint">方向键 / WASD 转弯 · OK 暂停 · 返回键暂停</p>
    </div>
  </div>

  <!-- 暂停 -->
  <div id="pauseScreen" class="overlay hidden">
    <div class="card">
      <h2>暂停中</h2>
      <p id="pauseStat" class="subtitle"></p>
      <div class="btn-row">
        <button id="btnResume" class="big-btn tv-focus" data-tv-focus>继续游戏</button>
        <button id="btnRestart" class="text-btn tv-focus" data-tv-focus>重新开始</button>
        <button id="btnMute" class="text-btn tv-focus" data-tv-focus>声音</button>
        <button id="btnQuit" class="text-btn tv-focus" data-tv-focus>返回标题</button>
      </div>
    </div>
  </div>

  <!-- 结束 -->
  <div id="overScreen" class="overlay hidden">
    <div class="card">
      <div class="title-tag">GAME OVER</div>
      <h2 id="overTitle">这局结束啦</h2>
      <div class="score-box">
        <div class="score-item"><span class="score-label">本局分数</span><span id="overScore" class="score-num">0</span></div>
        <div class="score-item"><span class="score-label">小蛇长度</span><span id="overLen" class="score-num">3</span></div>
        <div class="score-item"><span class="score-label">到达关卡</span><span id="overLevel" class="score-num">1</span></div>
        <div class="score-item"><span class="score-label">历史最高</span><span id="overBest" class="score-num">0</span></div>
      </div>
      <p id="overTip" class="subtitle"></p>
      <div class="btn-row">
        <button id="btnReplay" class="big-btn tv-focus" data-tv-focus>再来一次</button>
        <button id="btnOverQuit" class="text-btn tv-focus" data-tv-focus>返回标题</button>
      </div>
    </div>
  </div>
</div>

<!-- 经典脚本（兼容 Android 6 WebView，不用 ES module） -->
<script src="../shared/input.js"></script>
<!-- TV 启动器兜底：MainActivity.onKeyDown 会 evaluateJavascript("TVLauncher.handleBack()")，
     把遥控 BACK 键转发到 TVInput 的 back 事件；没有这个全局对象时 BACK 永远到不了 JS。 -->
<script>window.TVLauncher=window.TVLauncher||{handleBack:function(){try{window.TVInput&&window.TVInput.trigger('back')}catch(e){}}};</script>
<script src="../shared/nav.js"></script>
<script src="../shared/fx.js"></script>
<script src="js/audio.js"></script>
<script src="js/game.js"></script>
</body>
</html>
